# nginx.conf — Production reverse proxy for Wabizz
# Handles TLS termination, HTTP→HTTPS redirect, rate limiting, and
# proxying to the Node/Bun app on port 3000.
#
# Usage with docker-compose --profile with-nginx:
#   Place your TLS cert at ./nginx/ssl/cert.pem
#   Place your TLS key  at ./nginx/ssl/key.pem
#
# For Cloudflare Workers deployments this file is NOT used.
# Cloudflare handles TLS and HTTP routing natively.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  # ── Mime types ──────────────────────────────────────────────────────────────
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Logging ─────────────────────────────────────────────────────────────────
  log_format json_combined escape=json
    '{'
      '"time":"$time_iso8601",'
      '"method":"$request_method",'
      '"uri":"$request_uri",'
      '"status":"$status",'
      '"bytes":"$body_bytes_sent",'
      '"referer":"$http_referer",'
      '"ua":"$http_user_agent",'
      '"rt":"$request_time",'
      '"ip":"$http_x_forwarded_for"'
    '}';

  access_log /var/log/nginx/access.log json_combined;
  error_log  /var/log/nginx/error.log  warn;

  # ── Performance ──────────────────────────────────────────────────────────────
  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  gzip               on;
  gzip_types         text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_proxied       any;
  gzip_min_length    1024;

  # ── Rate limiting zones ──────────────────────────────────────────────────────
  # Global: 100 req/s per IP (burst of 200)
  limit_req_zone  $binary_remote_addr  zone=global:10m  rate=100r/s;

  # Webhook endpoints: stricter — 10 req/s per IP
  limit_req_zone  $binary_remote_addr  zone=webhooks:5m  rate=10r/s;

  # ── Upstream ─────────────────────────────────────────────────────────────────
  upstream wabizz_app {
    server app:3000;
    keepalive 32;
  }

  # ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Allow health checks over plain HTTP (for load balancer probes)
    location /api/public/health {
      proxy_pass         http://wabizz_app;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto http;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS ────────────────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name _;

    # TLS — replace with real cert paths or use Certbot / acme.sh
    ssl_certificate      /etc/nginx/ssl/cert.pem;
    ssl_certificate_key  /etc/nginx/ssl/key.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;

    # ── Security headers (belt-and-suspenders — app also sets these) ───────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           DENY                                            always;
    add_header X-Content-Type-Options    nosniff                                         always;

    # ── Request size limits ───────────────────────────────────────────────────
    client_max_body_size 2m;

    # ── Timeouts ─────────────────────────────────────────────────────────────
    proxy_connect_timeout  5s;
    proxy_send_timeout     30s;
    proxy_read_timeout     30s;

    # ── Common proxy headers ──────────────────────────────────────────────────
    proxy_http_version     1.1;
    proxy_set_header       Upgrade           $http_upgrade;
    proxy_set_header       Connection        "upgrade";
    proxy_set_header       Host              $host;
    proxy_set_header       X-Real-IP         $remote_addr;
    proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header       X-Forwarded-Proto https;

    # ── Webhook endpoints (stricter rate limit) ───────────────────────────────
    location ~ ^/api/public/(twilio|paystack)-webhook {
      limit_req  zone=webhooks  burst=20  nodelay;
      proxy_pass http://wabizz_app;
    }

    # ── Scheduled / admin endpoints ───────────────────────────────────────────
    location /api/public/scheduled {
      # Only allow internal calls — block public access
      # Remove this allow block if you call it from external CI
      allow  127.0.0.1;
      allow  10.0.0.0/8;
      allow  172.16.0.0/12;
      allow  192.168.0.0/16;
      deny   all;
      proxy_pass http://wabizz_app;
    }

    # ── Default: all other routes ─────────────────────────────────────────────
    location / {
      limit_req  zone=global  burst=200  nodelay;
      proxy_pass http://wabizz_app;
    }
  }
}
